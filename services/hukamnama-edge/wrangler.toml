# The public Hukamnama API (api.gurbanisoul.com). Deployed by the owner with `npx wrangler deploy`
# from this directory; nothing here is deployed by CI yet. No account id, zone id or secret
# belongs in this file: wrangler reads the account from its login, and the origin secret is set
# with `npx wrangler secret put ORIGIN_SECRET`.
name = "hukamnama-edge"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# The bucket the Hukamnama service writes its public snapshot to (services/hukamnama, public.py).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "hukamnama-public"

[env.staging]
name = "hukamnama-edge-staging"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "hukamnama-public-staging"
