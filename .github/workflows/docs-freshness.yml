name: docs-freshness
# Weekly: regenerate the wiki's generated pages and list the pages to re-read — as ONE pull request.
# Every `tools/gen_*.py` that accepts `--write` is run (a new generator is picked up by opting in to
# `--write`; the others are skipped), then `tools/docs_check.py --freshness` lists the stamped pages
# whose cited code changed since their `verified` stamp, and the pages simply far behind. When a
# generator changed a file or a page is stale, the branch `bot/docs-refresh` is force-pushed (one
# commit on integration) and one pull request into integration is opened or updated, titled with the
# number of pages to re-read. The bot never moves a `verified` stamp: re-reading stays human.
#
# The pull request is opened with DOCS_BOT_TOKEN, as docs-pins does (so the required checks run on
# it, scripture-diff-guard enforced because the branch is `bot/…`). Without that secret, with a token
# that cannot push, when the guard or the stamp check refuses the commit, or when the pull-request
# step fails, the list arrives as the issue *docs: wiki pages to re-verify* instead — the old
# behaviour. A branch carrying commits the bot did not make (a person's re-verified stamps) is never
# overwritten; only the pull request's title and body are refreshed. Runbook:
# docs/process/runbooks/docs-site.md.
on:
  schedule:
    - cron: "7 7 * * 1"   # Monday 07:07 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write   # refresh or close the bot's pull request with the workflow's own token

concurrency:
  group: docs-freshness
  cancel-in-progress: false

env:
  BRANCH: bot/docs-refresh
  MARKER: "Refreshed-by: docs-freshness"
  ISSUE_TITLE: "docs: wiki pages to re-verify"

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAVE_BOT: ${{ secrets.DOCS_BOT_TOKEN != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: integration, fetch-depth: 0, persist-credentials: false }   # stamps are commits; the report walks history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: ".python-version" }
      - name: Sibling docs installed at their pins (as the docs job does)
        env: { GH_TOKEN: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
        run: |
          python3 tools/fetch_sibling_docs.py --check
          python3 tools/fetch_sibling_docs.py
      - name: The pinned database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dataset-cache
          key: dataset-${{ hashFiles('dataset.lock.json') }}
      - env: { GH_TOKEN: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
        run: python3 scripts/data/fetch_dataset.py --cache-dir .dataset-cache
      - name: Run every generator that accepts --write
        run: |
          : > "$RUNNER_TEMP/gens.md"
          for g in tools/gen_*.py; do
            if ! grep -qE "[\"']--write[\"']" "$g"; then echo "skip $g (no --write)"; echo "- \`$g\`: skipped (no \`--write\`)" >> "$RUNNER_TEMP/gens.md"; continue; fi
            echo "::group::$g --write"
            if python3 "$g" --write; then echo "- \`$g --write\`: ran" >> "$RUNNER_TEMP/gens.md"
            else echo "::warning::$g --write failed"; echo "- \`$g --write\`: **failed** (see the run)" >> "$RUNNER_TEMP/gens.md"; fi
            echo "::endgroup::"
          done
      - name: The pages to re-read
        run: |
          python3 tools/docs_check.py --freshness "$RUNNER_TEMP/fresh.md"
          python3 tools/docs_check.py --health "$RUNNER_TEMP/health.json"
      - name: What changed
        id: state
        run: |
          set -euo pipefail
          git status --porcelain
          changed=false; [ -n "$(git status --porcelain)" ] && changed=true
          pages="$(grep -c '^| `' "$RUNNER_TEMP/fresh.md" || true)"
          stale=false; [ -s "$RUNNER_TEMP/fresh.md" ] && stale=true
          fresh="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1])).get("fresh_pct"); print("" if v is None else v)' "$RUNNER_TEMP/health.json" || true)"
          # a branch with a commit the bot did not make (a person re-verified pages on it) is kept
          human=false
          if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null; then
            # every bot commit carries the marker; a person's commit or a merge does not
            total="$(git rev-list --count "origin/integration..origin/$BRANCH")"
            mine="$(git rev-list --count --fixed-strings --grep="$MARKER" "origin/integration..origin/$BRANCH")"
            [ "$total" -gt "$mine" ] && human=true
            echo "remote $BRANCH: $total commit(s), $mine by the bot"
          fi
          {
            echo "changed=$changed"; echo "stale=$stale"; echo "pages=${pages:-0}"; echo "human=$human"; echo "fresh=$fresh"
            echo "work=$([ "$changed" = true ] || [ "$stale" = true ] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Nothing to do — close the pull request and the issue
        if: steps.state.outputs.work == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN: ${{ steps.state.outputs.human }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ] && [ "$HUMAN" != "true" ]; then
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "Every stamped page is fresh and no generated page changed. $RUN_URL"
          fi
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Every stamped page is fresh. $RUN_URL"; fi
          echo "every stamped page is fresh and no generated page changed"
      - name: Commit locally, then refuse a moved stamp or a scripture change
        id: commit
        if: steps.state.outputs.work == 'true'
        env: { PAGES: "${{ steps.state.outputs.pages }}" }
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"
          git add -A
          {
            echo "## Regenerated"; echo
            if git diff --cached --quiet; then echo "No generated page changed."; else echo '```'; git diff --cached --stat; echo '```'; fi
            echo; cat "$RUNNER_TEMP/gens.md"; echo
            echo "## ${PAGES} pages to re-read"; echo
            if [ -s "$RUNNER_TEMP/fresh.md" ]; then cat "$RUNNER_TEMP/fresh.md"; else echo "Every stamped page is fresh."; fi
            echo
            echo "## What stays human"; echo
            echo "- Re-read each page listed above against the code it cites, fix what drifted and move its \`verified\` stamp. Push those commits to \`$BRANCH\`: the bot never moves a stamp, and never force-pushes over a commit it did not make."
            echo "- \`scripture-diff-guard\` is enforced on this branch: a commit here that adds or removes a Gurmukhi code point fails it."
            echo "- Merge with \`--merge\` (stamps point at commits on this branch)."
            echo; echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          # the commit can be empty: a pull request that only lists pages to re-read still needs one
          git commit -q --allow-empty -m "docs(wiki): weekly refresh — ${PAGES} pages to re-read" -m "$MARKER"
          # the bot never moves a verified stamp (frontmatter `verified:` and its commit/date lines)
          if git diff -U0 origin/integration...HEAD -- '*.md' '*.mdx' | grep -E '^[+-](verified:|  (commit|date):)'; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "why=a generator moved a \`verified\` stamp; the bot may not." >> "$GITHUB_OUTPUT"
            echo "::error::a generator moved a verified stamp"; exit 0
          fi
          if ! python3 tools/gurmukhi_diff.py --summary "$GITHUB_STEP_SUMMARY" origin/integration...HEAD; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "why=the scripture diff guard refused the commit: a generator added or removed a Gurmukhi code point (see the run's summary)." >> "$GITHUB_OUTPUT"
            echo "::error::the scripture diff guard refused the refresh commit"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Can DOCS_BOT_TOKEN push here? (a dry-run push; nothing is written)
        id: bot
        if: steps.commit.outputs.ok == 'true' && env.HAVE_BOT == 'true'
        env: { BOT: "${{ secrets.DOCS_BOT_TOKEN }}" }
        run: |
          # a token can authenticate yet lack write access (resource owner left as the user, not
          # approved by the organization, Contents read-only): find out before touching anything
          if git push --dry-run --force -q "https://x-access-token:${BOT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH" 2> "$RUNNER_TEMP/push.err"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "the bot token can push"
          else
            reason="$(grep -E '^(remote:|fatal:)' "$RUNNER_TEMP/push.err" | sed -E 's#https://[^ ]*@#https://#g' | head -3 | tr '\n' ' ')"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            { echo "reason<<EOF"; echo "$reason"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "::warning::DOCS_BOT_TOKEN cannot push to $GITHUB_REPOSITORY: $reason"
          fi
      - name: Open or refresh the pull request (as the token's owner)
        id: pr
        if: steps.commit.outputs.ok == 'true' && steps.bot.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
          BOT: ${{ secrets.DOCS_BOT_TOKEN }}
          HUMAN: ${{ steps.state.outputs.human }}
          PAGES: ${{ steps.state.outputs.pages }}
          FRESH: ${{ steps.state.outputs.fresh }}
        run: |
          set -euo pipefail
          title="docs(wiki): weekly refresh — ${PAGES} pages to re-read${FRESH:+ (${FRESH}% fresh)}"
          if [ "$HUMAN" = "true" ]; then
            echo "::notice::$BRANCH carries commits the bot did not make; it is kept as is and only the pull request is refreshed"
            printf '\n> The branch carries commits the bot did not make, so this week'"'"'s regeneration was not pushed. Merge or close this pull request and the next run starts afresh.\n' >> "$RUNNER_TEMP/body.md"
          else
            login="$(gh api user --jq .login)"; id="$(gh api user --jq .id)"; name="$(gh api user --jq '.name // .login')"
            git -c user.name="$name" -c user.email="${id}+${login}@users.noreply.github.com" commit -q --amend --no-edit --reset-author --allow-empty
            git push -q --force "https://x-access-token:${BOT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "refreshed #$existing"
          elif [ "$HUMAN" = "true" ]; then
            echo "::error::$BRANCH carries a person's commits but has no open pull request; open one or delete the branch"; exit 1
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base integration --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close the fallback issue — the pull request carries the list
        # with the workflow's own token: the bot token holds only contents + pull requests
        if: steps.pr.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Superseded by #${pr:-?} ($BRANCH)."; fi
      - name: Or one issue, when the bot cannot open the pull request
        # no token, a token that cannot push, a refused commit, or a failed pull-request step: the list is never lost
        if: >-
          always() && steps.state.outputs.work == 'true' &&
          (steps.commit.outputs.ok != 'true' || env.HAVE_BOT != 'true' || steps.bot.outputs.ok != 'true' || steps.pr.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_OK: ${{ steps.commit.outputs.ok }}
          COMMIT_WHY: ${{ steps.commit.outputs.why }}
          BOT_OK: ${{ steps.bot.outputs.ok }}
          BOT_REASON: ${{ steps.bot.outputs.reason }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          if [ "$COMMIT_OK" != "true" ]; then
            why="No pull request was opened: ${COMMIT_WHY:-the refresh commit could not be made; see the run.}"
          elif [ "$HAVE_BOT" != "true" ]; then
            why="DOCS_BOT_TOKEN is not set, so no pull request was opened."
          elif [ "$BOT_OK" != "true" ]; then
            why="DOCS_BOT_TOKEN is set but cannot push to this repository (${BOT_REASON:-no reason given}). Check it at https://github.com/settings/personal-access-tokens: resource owner **Algorythmos-AI** (not a personal account), repository **sggs-platform** selected, **Contents** and **Pull requests** read and write, and not *pending* organization approval."
          else
            why="The bot's pull-request step failed (${PR_OUTCOME}); see the run."
          fi
          {
            if [ -s "$RUNNER_TEMP/fresh.md" ]; then cat "$RUNNER_TEMP/fresh.md"; else echo "Every stamped page is fresh, but a generator changed a page."; fi
            printf '\n%s\n\nBy hand, in a branch from integration: run every %s, then %s.\n\nRun: %s\n' \
              "$why" "\`tools/gen_*.py --write\`" "\`python3 tools/docs_check.py --freshness\`" "$RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label documentation --body-file "$RUNNER_TEMP/issue.md"
          fi
