name: security
on:
  pull_request:
  push:
    branches: [integration, main]
  schedule:
    - cron: "0 6 * * 1"   # Monday full history scan
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      # Pinned gitleaks release. The SHA-256 is the linux_x64 line of the release's
      # published gitleaks_<V>_checksums.txt; bump both together.
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
      # The tarball (not the binary) is cached, so a cache hit is still checked
      # against the pinned hash below before anything is extracted.
      - name: cache gitleaks tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gitleaks-dl
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux_x64-${{ env.GITLEAKS_SHA256 }}
      - name: download gitleaks (retried, then verified)
        run: |
          set -euo pipefail
          GITLEAKS_TARBALL="$RUNNER_TEMP/gitleaks-dl/gitleaks.tar.gz"
          if [ -f "$GITLEAKS_TARBALL" ] && echo "${GITLEAKS_SHA256}  ${GITLEAKS_TARBALL}" | sha256sum -c --status; then
            echo "using cached gitleaks ${GITLEAKS_VERSION} tarball"
          else
            mkdir -p "$(dirname "$GITLEAKS_TARBALL")"
            rm -f "$GITLEAKS_TARBALL"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o "$GITLEAKS_TARBALL" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi
          if ! echo "${GITLEAKS_SHA256}  ${GITLEAKS_TARBALL}" | sha256sum -c -; then
            echo "::error::gitleaks ${GITLEAKS_VERSION} tarball does not match the pinned SHA-256 — refusing to run it"
            rm -f "$GITLEAKS_TARBALL"   # never let a bad file reach the cache
            exit 1
          fi
          tar -xzf "$GITLEAKS_TARBALL" gitleaks
          ./gitleaks version
      - name: gitleaks (open-source binary — no org license needed)
        run: |
          ./gitleaks detect --source . --no-git --redact --no-banner --config .gitleaks.toml --exit-code 1
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: bandit (python)
        run: |
          pip install bandit
          bandit -r webapp pipeline -ll || true
      - name: semgrep (OSS rulesets)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python p/javascript p/secrets"
        continue-on-error: true
      - name: actionlint (workflow files)
        uses: raven-actions/actionlint@v2
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: docs-site
        run: npm audit --audit-level=high
